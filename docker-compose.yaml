services:

  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  mongodb:
    image: mongo:8
    container_name: mongodb-container
    restart: unless-stopped

    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=0"

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  redis_data:
  mongo_data: